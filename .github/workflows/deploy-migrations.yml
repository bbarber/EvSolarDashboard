name: Deploy migrations & functions

# Staging: automatically on merge to main (when migrations/functions change).
# Production: manually via the "Run workflow" button (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

concurrency:
  # Serialize deploys per target; never cancel a migration mid-flight.
  group: deploy-migrations-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy to staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.109.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push
      # Deploy all edge functions (config.toml supplies per-function settings
      # like verify_jwt and the shared import map). Guarded so a repo with no
      # functions yet doesn't fail the deploy.
      - name: Deploy edge functions
        run: |
          if compgen -G "supabase/functions/*/index.ts" > /dev/null; then
            supabase functions deploy
          else
            echo "No edge functions to deploy."
          fi

  production:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.109.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push
      - name: Deploy edge functions
        run: |
          if compgen -G "supabase/functions/*/index.ts" > /dev/null; then
            supabase functions deploy
          else
            echo "No edge functions to deploy."
          fi
